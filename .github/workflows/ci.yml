name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall app/ -q

      - name: Fresh DB migration (Alembic)
        run: |
          rm -f fresh_test.db
          python -c "
          from alembic.config import Config
          from alembic import command
          cfg = Config('alembic.ini')
          cfg.set_main_option('sqlalchemy.url', 'sqlite:///./fresh_test.db')
          command.upgrade(cfg, 'head')
          print('Alembic upgrade head succeeded')
          "
          python -c "
          from sqlalchemy import create_engine, inspect
          engine = create_engine('sqlite:///./fresh_test.db')
          inspector = inspect(engine)
          tables = inspector.get_table_names()
          required = ['research_tasks', 'papers', 'research_contracts', 'research_questions',
                      'evidence_units', 'coverage_records', 'search_query_records', 'phase_runs']
          for t in required:
              assert t in tables, f'Missing table: {t}'
          print(f'All {len(required)} required tables exist')
          "
          rm -f fresh_test.db

      - name: Run tests (including legacy migration test)
        run: python -m pytest tests/ -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
